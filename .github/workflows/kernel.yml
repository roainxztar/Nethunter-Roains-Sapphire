name: Roains NetHunter Sapphire Kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: sapphire-kernel-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate patches, configure and compile
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache clang-14 flex git libelf-dev libssl-dev lld-14 llvm-14 pahole python3 python-is-python3 rsync
          test -x /usr/bin/ld.lld-14
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/clang-14 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-14 /usr/local/bin/clang++
          for tool in ar ranlib nm objcopy objdump strip readelf; do
            test -x "/usr/bin/llvm-${tool}-14"
            sudo ln -sf "/usr/bin/llvm-${tool}-14" "/usr/local/bin/llvm-${tool}"
          done
          llvm-ar --version
          ld.lld --version
          clang --version

      - name: Fetch ChicKernel source and integrate required security source
        run: |
          git clone --depth=1 --branch android13-5.15-lts https://github.com/ChicKernel/device_xiaomi_gemstones-kernel.git kernel
          test "$(make -s -C kernel kernelversion)" = "5.15.189"
          rm -rf kernel/drivers/kernelsu
          mkdir -p kernel/drivers/kernelsu
          printf "%s\\n" "# KernelSU intentionally omitted in this no-root build." > kernel/drivers/kernelsu/Kconfig
          git -C kernel submodule update --init --depth 1 Baseband-guard
          test -f kernel/Baseband-guard/Kconfig
          ln -s ../Baseband-guard kernel/security/baseband-guard
          test -f kernel/security/baseband-guard/Kconfig
          test -f kernel/security/baseband-guard/Makefile
          echo "Baseband-guard linked; no root manager is integrated."

      - name: Fetch and strictly validate NetHunter 5.15 patch
        run: |
          git clone --depth=1 https://github.com/roainxztar/kali-nethunter-kernel-patches.git nethunter-patches
          patch_file="nethunter-patches/adapted/5.15/add-wifi-injection-5.15.patch"
          test -s "$patch_file"
          git -C kernel apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$patch_file"
          git -C kernel apply --whitespace=fix "$GITHUB_WORKSPACE/$patch_file"
          git -C kernel diff --check
          git -C kernel diff --stat | tee patch-integration.txt
          grep -q 'ieee80211_tx_h_sequence' <(git -C kernel diff -- net/mac80211/tx.c)
          echo "NetHunter 5.15 patch applied and verified." | tee -a patch-integration.txt

      - name: Configure NetHunter, Docker, CAN, SDR and peripheral support
        working-directory: kernel
        run: |
          set -euo pipefail
          make O=out ARCH=arm64 LLVM=-14 LD=ld.lld-14 chickernel_defconfig
          cfg="scripts/config --file out/.config"
          $cfg --set-str LOCALVERSION "-Nethunter-Roains-Sapphire"
          $cfg --disable LOCALVERSION_AUTO

          # Full LTO can create a large peak-memory spike during vmlinux linking.
          # Use ThinLTO while preserving CFI and Shadow Call Stack.
          $cfg --disable LTO_CLANG_FULL
          $cfg --enable LTO_CLANG_THIN

          # Enable loadable-module support: MT76 USB adapters are tristate
          # drivers and cannot resolve to m without CONFIG_MODULES=y.
          $cfg --enable MODULES

          # Namespaces and Docker/chroot foundations.
          for opt in NAMESPACES PID_NS NET_NS SYSVIPC IPC_NS UTS_NS USER_NS CGROUPS MEMCG CGROUP_FREEZER CPUSETS CGROUP_PIDS CGROUP_CPUACCT CGROUP_SCHED CGROUP_DEVICE CGROUP_BPF BLK_CGROUP SECCOMP SECCOMP_FILTER BPF_SYSCALL BPF_JIT OVERLAY_FS FUSE_FS BLK_DEV_LOOP BLK_DEV_DM DM_CRYPT DM_VERITY VETH TUN BRIDGE BRIDGE_NETFILTER VLAN_8021Q NETFILTER NF_CONNTRACK NF_NAT NETFILTER_XTABLES NF_TABLES IP_NF_IPTABLES IP_NF_NAT IP6_NF_IPTABLES IP6_NF_NAT; do
            $cfg --enable "$opt" || true
          done

          # NetHunter wireless, HID gadget, Bluetooth transports and NFS.
          for opt in WLAN WLAN_VENDOR_MEDIATEK CFG80211 MAC80211 WIRELESS RFKILL USB USB_GADGET USB_CONFIGFS USB_CONFIGFS_F_HID USB_CONFIGFS_F_FS USB_CONFIGFS_MASS_STORAGE USB_CONFIGFS_ACM USB_CONFIGFS_RNDIS USB_CONFIGFS_ECM USB_CONFIGFS_NCM BT BT_HCIBTUSB BT_HCIBTUSB_BCM BT_HCIBTUSB_RTL BT_HCIBTUSB_MTK BT_HCIUART BT_HCIUART_H4 BT_HCIUART_QCA BT_RFCOMM BT_HIDP NFS_FS NFSD; do
            $cfg --enable "$opt" || true
          done

          # Diagnose MT76 Kconfig discovery before requesting driver modules.
          echo "=== MT76 source-tree diagnostics ==="
          for path in drivers/net/wireless/Kconfig drivers/net/wireless/mediatek/Kconfig drivers/net/wireless/mediatek/mt76/Kconfig drivers/net/wireless/mediatek/mt76/mt76x0/Kconfig drivers/net/wireless/mediatek/mt76/mt76x2/Kconfig; do
            test -f "$path" || { echo "MISSING: $path"; exit 1; }
            echo "FOUND: $path"
          done
          grep -n 'mediatek/Kconfig' drivers/net/wireless/Kconfig
          grep -n 'mt76/Kconfig' drivers/net/wireless/mediatek/Kconfig
          for path in drivers/net/wireless/mediatek/mt76/mt76x0/Kconfig drivers/net/wireless/mediatek/mt76/mt76x2/Kconfig; do
            grep -nE '^config (MT76x0U|MT76x2U)' "$path"
          done
          # These Kconfig symbols contain lowercase x and uppercase U. The
          # scripts/config default uppercases symbols, so preserve exact case.
          $cfg --keep-case --module MT76x0U
          $cfg --keep-case --module MT76x2U
          echo "=== MT76 requested values before olddefconfig ==="
          grep -E '^(CONFIG_MT76x0U=|CONFIG_MT76x2U=|# CONFIG_MT76)' out/.config || true
          echo "=== MT76 parent values before olddefconfig ==="
          for opt in MODULES WLAN WLAN_VENDOR_MEDIATEK CFG80211 MAC80211 USB USB_SUPPORT; do
            grep -E "^(CONFIG_${opt}=|# CONFIG_${opt} is not set)" out/.config || true
          done
          # CAN stack; HLCAN is not present in this source tree.
          for opt in CAN CAN_RAW CAN_BCM CAN_GW CAN_VCAN CAN_VXCAN CAN_SLCAN CAN_DEV CAN_CALC_BITTIMING; do
            $cfg --enable "$opt" || true
          done

          # RTL2832 SDR software stack.
          for opt in MEDIA_SUPPORT MEDIA_DIGITAL_TV_SUPPORT MEDIA_SDR_SUPPORT VIDEO_DEV VIDEO_V4L2 DVB_CORE DVB_USB_V2 DVB_USB_RTL28XXU DVB_RTL2832 DVB_RTL2832_SDR I2C I2C_MUX VIDEOBUF2_VMALLOC; do
            $cfg --enable "$opt" || true
          done

          make O=out ARCH=arm64 LLVM=-14 LD=ld.lld-14 olddefconfig
          cp out/.config ../final-kernel.config
          {
            echo "=== Requested feature configuration after olddefconfig ==="
            for opt in MODULES LTO_CLANG_THIN CFI_CLANG SHADOW_CALL_STACK PID_NS NET_NS IPC_NS UTS_NS USER_NS CGROUPS CGROUP_DEVICE MEMCG CGROUP_FREEZER CPUSETS CGROUP_PIDS CGROUP_CPUACCT CGROUP_SCHED SECCOMP SECCOMP_FILTER BPF_SYSCALL OVERLAY_FS FUSE_FS BLK_DEV_LOOP BLK_DEV_DM VETH TUN BRIDGE BRIDGE_NETFILTER NF_CONNTRACK NF_NAT IP_NF_NAT IP6_NF_NAT WLAN WLAN_VENDOR_MEDIATEK CFG80211 MAC80211 USB USB_SUPPORT MT76_CORE MT76_USB MT76x02_LIB MT76x02_USB MT76x0_COMMON MT76x2_COMMON USB_CONFIGFS_F_HID BT_HCIBTUSB BT_HCIBTUSB_RTL BT_HCIUART_QCA NFS_FS NFSD MT76x0U MT76x2U CAN_RAW CAN_VCAN CAN_SLCAN MEDIA_SDR_SUPPORT DVB_RTL2832_SDR DVB_USB_RTL28XXU; do
              grep -E "^(CONFIG_${opt}=(y|m)|# CONFIG_${opt} is not set)" out/.config || true
            done
          } | tee ../config-verification.txt

          grep -q '^CONFIG_MODULES=y$' out/.config
          grep -q '^CONFIG_LTO_CLANG_THIN=y$' out/.config
          ! grep -q '^CONFIG_LTO_CLANG_FULL=y$' out/.config
          grep -q '^CONFIG_CFI_CLANG=y$' out/.config
          grep -q '^CONFIG_SHADOW_CALL_STACK=y$' out/.config
          for opt in PID_NS NET_NS IPC_NS UTS_NS USER_NS CGROUPS CGROUP_DEVICE MEMCG CGROUP_FREEZER CPUSETS CGROUP_PIDS SECCOMP SECCOMP_FILTER WLAN WLAN_VENDOR_MEDIATEK CFG80211 MAC80211 USB USB_SUPPORT USB_CONFIGFS_F_HID; do
            grep -q "^CONFIG_${opt}=y$" out/.config
          done
          for opt in NFS_FS NFSD BT_HCIUART_QCA CAN_RAW CAN_VCAN CAN_SLCAN MEDIA_SDR_SUPPORT DVB_RTL2832_SDR DVB_USB_RTL28XXU; do
            grep -Eq "^CONFIG_${opt}=(y|m)$" out/.config
          done
          for opt in MT76x0U MT76x2U; do
            grep -q "^CONFIG_${opt}=m$" out/.config
          done
          ! grep -q '^CONFIG_KSU=y$' out/.config
          ! grep -q '^CONFIG_KERNELSU=y$' out/.config

      - name: Compile kernel, modules and DTBs
        working-directory: kernel
        run: |
          ! grep -q '^CONFIG_KSU=y$' out/.config
          JOBS=2
          echo "Compiling with $JOBS parallel jobs (memory-conscious ThinLTO build)"
          free -h
          (
            while sleep 30; do
              echo "=== Build memory snapshot: $(date -u +'%Y-%m-%dT%H:%M:%SZ') ==="
              free -h
              grep -E '^(MemAvailable|SwapFree):' /proc/meminfo || true
              if [ -r /proc/pressure/memory ]; then cat /proc/pressure/memory; fi
            done
          ) &
          memmon_pid=$!
          trap 'kill "$memmon_pid" 2>/dev/null || true; wait "$memmon_pid" 2>/dev/null || true' EXIT
          make -j"$JOBS" O=out ARCH=arm64 LLVM=-14 LD=ld.lld-14 KCFLAGS="-mllvm -regalloc-enable-advisor=default -Wno-error=unused-but-set-variable -Wno-error=unused-const-variable" KBUILD_LDFLAGS="-mllvm -regalloc-enable-advisor=default" Image.gz modules dtbs
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          cp out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/build-output/"
          cp out/.config "$GITHUB_WORKSPACE/build-output/kernel.config"
          make O=out ARCH=arm64 LLVM=-14 LD=ld.lld-14 INSTALL_MOD_PATH="$GITHUB_WORKSPACE/staging" modules_install
          depmod -b "$GITHUB_WORKSPACE/staging" "$(cat out/include/config/kernel.release)"
          cp -a "$GITHUB_WORKSPACE/staging/lib/modules" "$GITHUB_WORKSPACE/build-output/"
          find out/arch/arm64/boot/dts -type f \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp --parents {} "$GITHUB_WORKSPACE/build-output/" \;

      - name: Upload verified non-KSU build outputs
        uses: actions/upload-artifact@v4
        with:
          name: Roains-Nethunter-Sapphire-no-root
          path: |
            build-output/
            final-kernel.config
            config-verification.txt
            patch-integration.txt
          if-no-files-found: error
          retention-days: 14 out/.config
          grep -q '^CONFIG_LTO_CLANG_THIN=y NET_NS IPC_NS UTS_NS USER_NS CGROUPS CGROUP_DEVICE MEMCG CGROUP_FREEZER CPUSETS CGROUP_PIDS SECCOMP SECCOMP_FILTER WLAN WLAN_VENDOR_MEDIATEK CFG80211 MAC80211 USB USB_SUPPORT USB_CONFIGFS_F_HID; do
            grep -q "^CONFIG_${opt}=y$" out/.config
          done
          for opt in NFS_FS NFSD BT_HCIUART_QCA CAN_RAW CAN_VCAN CAN_SLCAN MEDIA_SDR_SUPPORT DVB_RTL2832_SDR DVB_USB_RTL28XXU; do
            grep -Eq "^CONFIG_${opt}=(y|m)$" out/.config
          done
          for opt in MT76x0U MT76x2U; do
            grep -q "^CONFIG_${opt}=m$" out/.config
          done
          ! grep -q '^CONFIG_KSU=y$' out/.config
          ! grep -q '^CONFIG_KERNELSU=y$' out/.config

      - name: Compile kernel, modules and DTBs
        working-directory: kernel
        run: |
          ! grep -q '^CONFIG_KSU=y$' out/.config
          JOBS="$(nproc)"; if [ "$JOBS" -gt 4 ]; then JOBS=4; fi
          echo "Compiling with $JOBS parallel jobs"
          free -h
          make -j"$JOBS" O=out ARCH=arm64 LLVM=-14 LD=ld.lld-14 KCFLAGS="-mllvm -regalloc-enable-advisor=default -Wno-error=unused-but-set-variable -Wno-error=unused-const-variable" KBUILD_LDFLAGS="-mllvm -regalloc-enable-advisor=default" Image.gz modules dtbs
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          cp out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/build-output/"
          cp out/.config "$GITHUB_WORKSPACE/build-output/kernel.config"
          make O=out ARCH=arm64 LLVM=-14 LD=ld.lld-14 INSTALL_MOD_PATH="$GITHUB_WORKSPACE/staging" modules_install
          depmod -b "$GITHUB_WORKSPACE/staging" "$(cat out/include/config/kernel.release)"
