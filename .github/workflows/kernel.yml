name: Roains-Nethunter-Sapphire

on:
  workflow_dispatch:
  push:
    branches:
      - build/r9-nethunter
    paths:
      - ".github/workflows/kernel.yml"
      - "config/**"
      - "abi/**"
      - "patches/**"
      - "scripts/**"
      - "installer/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: roains-nethunter-sapphire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo rsync aria2 bc bison flex build-essential \
            libelf-dev libssl-dev python3 zip unzip kmod dwarves cpio \
            device-tree-compiler libncurses-dev lz4 binutils ccache

      - name: Prepare swap
        run: |
          set -euo pipefail
          # Keep the runner's active swapfile intact and add dedicated build swap.
          SWAPFILE=/swapfile-nethunter
          if ! swapon --noheadings --show=NAME | grep -Fxq "$SWAPFILE"; then
            if [ ! -e "$SWAPFILE" ]; then
              sudo fallocate -l 8G "$SWAPFILE"
              sudo chmod 600 "$SWAPFILE"
              sudo mkswap "$SWAPFILE"
            fi
            sudo swapon "$SWAPFILE"
          fi
          swapon --show
          free -h
          df -h /

      - name: Restore exact R9 kernel configuration
        run: |
          mkdir -p config
          base64 -d config/r9-kernel.config.gz.b64 | gzip -dc > /tmp/r9-kernel.config
          test -s /tmp/r9-kernel.config
          grep -q '^CONFIG_MODULES=y$' /tmp/r9-kernel.config
          grep -q '^CONFIG_MODVERSIONS=y$' /tmp/r9-kernel.config
          grep -q '^CONFIG_LTO_CLANG_FULL=y$' /tmp/r9-kernel.config
          grep -q '^CONFIG_CFI_CLANG=y$' /tmp/r9-kernel.config
          grep -q '^CONFIG_SHADOW_CALL_STACK=y$' /tmp/r9-kernel.config

      - name: Fetch exact Zepharo R9 source
        run: |
          mkdir -p common_gki/common
          git -C common_gki/common init
          git -C common_gki/common remote add origin https://github.com/topnotchfreaks/kernel_msm-5.15.git
          git -C common_gki/common fetch --depth=1 origin c3405fe3912bf981aa5129a74410104140a25a93
          git -C common_gki/common checkout --detach FETCH_HEAD
          test "$(git -C common_gki/common rev-parse HEAD)" = "c3405fe3912bf981aa5129a74410104140a25a93"
          test "$(make -s -C common_gki/common kernelversion)" = "5.15.211"

      - name: Fetch Android Common build system and pinned Clang
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j"$(nproc)"
          rm -rf .repo common

      - name: Configure R9 baseline and NetHunter features
        run: |
          KERNEL="$GITHUB_WORKSPACE/common_gki/common"
          DEFCONFIG="$KERNEL/arch/arm64/configs/roains_nethunter_sapphire_defconfig"
          cp /tmp/r9-kernel.config "$DEFCONFIG"
          bash scripts/configure_features.sh "$DEFCONFIG" "$KERNEL"

          git -C "$KERNEL" apply --check "$GITHUB_WORKSPACE/patches/nethunter-mac80211-5.15.patch"
          git -C "$KERNEL" apply "$GITHUB_WORKSPACE/patches/nethunter-mac80211-5.15.patch"

          sed -i 's/^DEFCONFIG=.*/DEFCONFIG=roains_nethunter_sapphire_defconfig/' "$KERNEL/build.config.gki"
          sed -i '/POST_DEFCONFIG_CMDS=/d' "$KERNEL/build.config.gki"
          echo 'POST_DEFCONFIG_CMDS=""' >> "$KERNEL/build.config.gki"

          CFG="$KERNEL/build.config.gki.aarch64"
          sed -i '/^KMI_SYMBOL_LIST_STRICT_MODE=/d; /^TRIM_NONLISTED_KMI=/d; /^KMI_ENFORCED=/d; /^MODULES_ORDER=/d; /^MODULES_LIST=/d' "$CFG"
          cat >> "$CFG" <<'EOF'
          KMI_SYMBOL_LIST_STRICT_MODE=0
          TRIM_NONLISTED_KMI=0
          KMI_ENFORCED=0
          MAKE_GOALS="${MAKE_GOALS} Image modules"
          EOF

          sed -i '/^BRANCH=/d; /^CLANG_VERSION=/d' "$KERNEL/build.config.constants"
          cat >> "$KERNEL/build.config.constants" <<'EOF'
          BRANCH=android13-5.15
          CLANG_VERSION=r450784e
          EOF

          # Confirm the selected build config chain: aarch64 config sources
          # build.config.gki, which selects our R9-derived custom defconfig.
          grep -Fq '. ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki' "$CFG"
          grep -qx 'DEFCONFIG=roains_nethunter_sapphire_defconfig' "$KERNEL/build.config.gki"
          test -s "$DEFCONFIG"
          grep -q '^CONFIG_MODULES=y$' "$DEFCONFIG"
          grep -q '^CONFIG_CFI_CLANG=y$' "$DEFCONFIG"
          grep -q '^CONFIG_SHADOW_CALL_STACK=y$' "$DEFCONFIG"
          grep -q '^CONFIG_LTO_CLANG_FULL=y$' "$DEFCONFIG"
          echo "Build config chain verified: build.config.gki.aarch64 -> build.config.gki -> roains_nethunter_sapphire_defconfig"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-r9-5.15.211-${{ hashFiles('config/r9-kernel.config.gz.b64', 'scripts/configure_features.sh', 'patches/nethunter-mac80211-5.15.patch') }}
          restore-keys: |
            ccache-${{ runner.os }}-r9-5.15.211-

      - name: Build kernel and modules with R9 toolchain settings
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 5G
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -z
          ROOT_DIR="$GITHUB_WORKSPACE" \
          KERNEL_DIR="common_gki/common" \
          OUT_DIR="$GITHUB_WORKSPACE/out" \
          BUILD_CONFIG="common_gki/common/build.config.gki.aarch64" \
          CC="ccache clang" LTO=full build/build.sh -j"$(nproc)"
          ccache -s

      - name: Capture generated kernel config
        if: always()
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          CONFIG="$(find out -type f -name .config -print -quit || true)"
          if [ -n "$CONFIG" ] && [ -s "$CONFIG" ]; then
            cp "$CONFIG" diagnostics/kernel.config
            echo "Captured generated config from: $CONFIG"
          else
            echo "No generated .config exists yet; nothing to capture."
          fi

      - name: Upload generated kernel config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Roains-Nethunter-Sapphire-kernel-config
          path: diagnostics/kernel.config
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify final config and module ABI
        run: |
          set -euo pipefail
          CONFIG="$(find out -name .config -type f | head -n1)"
          SYMVERS="$(find out -name Module.symvers -type f | head -n1)"
          IMAGE="$(find out -type f -path '*/arch/arm64/boot/Image' | head -n1)"
          MAC80211="$(find out -type f -name mac80211.ko | head -n1)"
          test -s "$CONFIG" && test -s "$SYMVERS" && test -s "$IMAGE" && test -s "$MAC80211"

          require() { grep -qx "$1" "$CONFIG" || { echo "Missing final config: $1"; exit 1; }; }
          require "CONFIG_MODULES=y"
          require "CONFIG_MODVERSIONS=y"
          require "CONFIG_CFI_CLANG=y"
          require "CONFIG_SHADOW_CALL_STACK=y"
          require "CONFIG_LTO_CLANG_FULL=y"
          require "CONFIG_CGROUPS=y"
          require "CONFIG_MEMCG=y"
          require "CONFIG_CGROUP_FREEZER=y"
          require "CONFIG_CPUSETS=y"
          require "CONFIG_CGROUP_SCHED=y"
          require "CONFIG_CGROUP_CPUACCT=y"
          require "CONFIG_BPF_SYSCALL=y"
          require "CONFIG_SECCOMP=y"
          require "CONFIG_SECCOMP_FILTER=y"
          require "CONFIG_NET_NS=y"
          require "CONFIG_UTS_NS=y"
          require "CONFIG_TUN=y"
          require "CONFIG_VETH=y"
          require "CONFIG_OVERLAY_FS=y"
          require "CONFIG_FUSE_FS=y"
          require "CONFIG_BLK_DEV_LOOP=y"
          require "CONFIG_BLK_DEV_DM=y"
          require "CONFIG_DM_CRYPT=y"
          require "CONFIG_NETFILTER=y"
          require "CONFIG_NF_CONNTRACK=y"
          require "CONFIG_IP_NF_NAT=y"
          require "CONFIG_IP6_NF_NAT=y"
          require 'CONFIG_LOCALVERSION="-Nethunter-Roains-Sapphire"'
          require "# CONFIG_LOCALVERSION_AUTO is not set"
          require "CONFIG_CFG80211=m"
          require "CONFIG_MAC80211=m"
          require "CONFIG_PID_NS=y"
          require "CONFIG_USER_NS=y"
          require "CONFIG_IPC_NS=y"
          require "CONFIG_CGROUP_PIDS=y"
          require "CONFIG_CGROUP_DEVICE=y"
          require "CONFIG_USB_CONFIGFS_RNDIS=y"
          require "CONFIG_CAN_VCAN=m"
          require "CONFIG_CAN_VXCAN=m"
          require "CONFIG_CAN_SLCAN=m"
          require "CONFIG_NFS_FS=m"
          require "CONFIG_NFSD=m"
          require "CONFIG_MEDIA_SDR_SUPPORT=y"
          require "CONFIG_DVB_CORE=m"
          require "CONFIG_DVB_USB_V2=m"
          require "CONFIG_DVB_USB_RTL28XXU=m"
          require "CONFIG_DVB_RTL2832=m"
          require "CONFIG_DVB_RTL2832_SDR=m"
          require "CONFIG_MEDIA_USB_SUPPORT=y"
          require "CONFIG_MEDIA_SUPPORT=y"
          require "CONFIG_USB_CONFIGFS_F_HID=y"
          require "CONFIG_USB_CONFIGFS_F_FS=y"
          require "CONFIG_USB_CONFIGFS_MASS_STORAGE=y"

          python3 scripts/verify_abi.py \
            --symvers "$SYMVERS" \
            --module "$MAC80211" \
            --r9-baseline abi/r9-vendor-abi.tsv.gz.b64 \
            --qca-baseline abi/qca-cfg80211-abi.tsv.gz.b64 \
            --report out/abi-report.txt

          mkdir -p diagnostics
          cp "$CONFIG" diagnostics/kernel.config
          cp "$SYMVERS" diagnostics/Module.symvers
          cp "$IMAGE" diagnostics/Image
          cp "$MAC80211" diagnostics/mac80211.ko
          cp out/abi-report.txt diagnostics/

      - name: Stage compact flashable ZIP
        run: |
          set -euo pipefail
          mkdir -p package/META-INF/com/google/android package/modules package/tools
          IMAGE="$(find out -type f -path '*/arch/arm64/boot/Image' | head -n1)"
          cp "$IMAGE" package/Image

          # Collect selected feature modules and their module dependencies.
          python3 scripts/package_modules.py out package/modules
          test -s package/modules/mac80211.ko

          curl -fL --retry 3 -o /tmp/Magisk-v31.1.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk
          ASSET="$(unzip -Z1 /tmp/Magisk-v31.1.apk | grep -E 'lib/arm64-v8a/libmagiskboot.so$' | head -n1)"
          test -n "$ASSET"
          unzip -p /tmp/Magisk-v31.1.apk "$ASSET" > package/tools/magiskboot
          chmod 755 package/tools/magiskboot

          cp installer/update-binary package/META-INF/com/google/android/update-binary
          cp installer/updater-script package/META-INF/com/google/android/updater-script
          chmod 755 package/META-INF/com/google/android/update-binary
          (cd package && zip -9 -X -r "$GITHUB_WORKSPACE/Roains-Nethunter-Sapphire-5.15.211.zip" .)
          ls -lh "$GITHUB_WORKSPACE/Roains-Nethunter-Sapphire-5.15.211.zip"

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Roains-Nethunter-Sapphire-5.15.211
          path: Roains-Nethunter-Sapphire-5.15.211.zip
          if-no-files-found: error
          retention-days: 30
